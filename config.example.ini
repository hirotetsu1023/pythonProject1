[apple]
; Apple ID (iCloud にサインインしているメールアドレス)
apple_id = your_apple_id@example.com
; https://appleid.apple.com > [サインインとセキュリティ] > [Appサインイン用パスワード] で
; 発行した16文字のパスワード (Apple ID側で2ファクタ認証が有効になっている必要があります)
app_specific_password = xxxx-xxxx-xxxx-xxxx

[gmail]
; 送信元 Gmail アドレス
address = tetsu.com.dayon@gmail.com
; Google アカウントの2段階認証を有効にした上で発行するアプリパスワード
; (Googleアカウント > セキュリティ > アプリ パスワード。16文字、スペースは詰めて貼り付け)
app_password = xxxxxxxxxxxxxxxx
; 送信先。省略した場合は address と同じ宛先になる
to_address = tetsu.com.dayon@gmail.com
